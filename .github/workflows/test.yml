name: Tests
on: [push, pull_request]
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        esphome: ['2026.3.0', '2026.9.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install esphome==${{ matrix.esphome }} pytest
      - run: python tests/run_host_tests.py
      - run: python -m pytest tests/integration -q
      - run: python -m esphome compile examples/esk1_basic_status_board.yaml
      - run: python -m esphome compile tests/integration/esk1_device_checks.yaml
