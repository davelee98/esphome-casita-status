# Replace these HA entity IDs with your measurements. Top is action-driven.
packages:
  esk1: !include ../references/ESPHome-Starter-Kit/Integrations/ESPHome/ESK-1.yaml
  status_board: !include ../packages/casita_status.yaml

esphome:
  name: casita-status-board
  friendly_name: Casita Status Board
  min_version: 2026.3.0

sensor:
  - platform: homeassistant
    id: ha_bedroom_co2
    entity_id: sensor.bedroom_co2
  - platform: homeassistant
    id: ha_outdoor_aqi
    entity_id: sensor.outdoor_aqi
  - platform: homeassistant
    id: ha_bedroom_voc
    entity_id: sensor.bedroom_voc_index

casita_status:
  brightness: 50%
  groups:
    left:
      type: co2
      sensor: ha_bedroom_co2
    right:
      type: aqi
      sensor: ha_outdoor_aqi
    center:
      type: voc
      sensor: ha_bedroom_voc
    top:
      type: status

# Uses the upstream fallback AP by default. For normal HA operation, supply your
# wifi.ssid/password and api.encryption key in your own config (see README.md).
